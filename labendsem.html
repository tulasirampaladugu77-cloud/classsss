
import React from "react";

function Calculator() {
  let a = 20;
  let b = 10;

  return (
    <div>
      <h1>Simple Calculator</h1>

      <h3>Addition: {a + b}</h3>
      <h3>Subtraction: {a - b}</h3>
      <h3>Multiplication: {a * b}</h3>
      <h3>Division: {a / b}</h3>
    </div>
  );
}

function App() {
  return (
    <div>
      <Calculator />
    </div>
  );
}

export default App;
