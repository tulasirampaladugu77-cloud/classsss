<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Optons</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: #c0c0d179;
            padding: 1rem;
        }

        .container {
            width: 100%;
            height: calc(100vh - 2rem);
            display: flex;
            flex-direction: column;
            gap: 1rem;
            text-align: center;
        }

        h1 {
            margin: 0;
            color: #333;
        }

        .options {
            flex: 1;
            display: flex;
            gap: 1rem;
            align-items: stretch;
        }

        .option-box {
            position: relative;
            flex: 1 1 0;
            width: 100%;
            min-height: 0;
            border-radius: 20px;
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.12);
            cursor: pointer;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            font-weight: bold;
            font-size: 1.2rem;
        }
        .option-box:hover {
            transform: translateY(-4px);
            box-shadow: 0 16px 30px rgba(0, 0, 0, 0.18);
        }
        .option-box.selected {
            outline: 4px solid #ffffff;
            outline-offset: -8px;
            opacity: 0.95;
        }
        .option-box::after {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: rgba(0,0,0,0.12);
            opacity: 0;
            transition: opacity 0.2s ease;
        }
        .option-box.selected::after {
            opacity: 0.15;
        }
        .option-box.blue { background: linear-gradient(135deg, #4b6cb7, #182848); }
        .option-box.red { background: linear-gradient(135deg, #f85032, #e73827); }
        .option-box.green { background: linear-gradient(135deg, #11998e, #38ef7d); }
        .option-box.purple { background: linear-gradient(135deg, #8e2de2, #4a00e0); }
        .selected-text {
            margin: 0;
            color: #555;
            font-size: 1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Select a Color Option</h1>
        <div class="options">
            <div class="option-box blue" data-color="Blue">Blue Option selected</div>
            <div class="option-box red" data-color="Red">Red Option selected</div>
            <div class="option-box green" data-color="Green">Green Option selected</div>
            <div class="option-box purple" data-color="Purple">Purple Option selected</div>
        </div>
        <p class="selected-text">No option selected yet.</p>
    </div>
    <script>
        const boxes = document.querySelectorAll('.option-box');
        const selectedText = document.querySelector('.selected-text');

        boxes.forEach(box => {
            box.addEventListener('click', () => {
                boxes.forEach(item => item.classList.remove('selected'));
                box.classList.add('selected');
                selectedText.textContent = `Selected option: ${box.dataset.color}`;
            });
        });
    </script>
</body>
</html>
